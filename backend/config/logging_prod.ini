[loggers]
keys=root

[handlers]
keys=consoleHandler,infoFileHandler,errorFileHandler

[formatters]
keys=prodFormatter

[filters]
keys=requestIdFilter

[logger_root]
level=INFO
handlers=consoleHandler,infoFileHandler,errorFileHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=prodFormatter
args=(sys.stdout,)
filters=requestIdFilter

[handler_infoFileHandler]
# 多 worker（gunicorn -w 4）下 TimedRotatingFileHandler 不可靠：各 worker 并发 doRollover
# 会互相 rename/覆盖归档，表现为日志不滚动、文件持续增大。
# 改用普通 FileHandler（追加模式），按天滚动交给 logrotate（copytruncate，见 deploy/logrotate/smilex-cloud）。
class=FileHandler
level=INFO
formatter=prodFormatter
args=('%(log_dir)s/info.log','a','utf-8')
filters=requestIdFilter

[handler_errorFileHandler]
class=FileHandler
level=ERROR
formatter=prodFormatter
args=('%(log_dir)s/error.log','a','utf-8')
filters=requestIdFilter

[filter_requestIdFilter]
class=core.log.request_id_filter.RequestIdFilter

[formatter_prodFormatter]
class=core.log.request_id_filter.RequestIdFormatter
format=%(asctime)s %(levelname)s %(name)s %(module)s %(lineno)d %(process)d %(thread)d %(request_id)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%S
