[loggers]
keys=root

[handlers]
keys=consoleHandler,devFileHandler

[formatters]
keys=devFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,devFileHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=devFormatter
args=(sys.stdout,)  # 单行参数，括号直接闭合

[handler_devFileHandler]
class=logging.handlers.TimedRotatingFileHandler
level=DEBUG
formatter=devFormatter
args=('logs/app.log','D',1,14,'utf-8',False,False)

[formatter_devFormatter]
format=%(asctime)s %(levelname)-8s [%(name)s:%(module)s:%(lineno)d] [PID:%(process)d] %(message)s
datefmt=%Y-%m-%d %H:%M:%S