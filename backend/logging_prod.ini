[loggers]
keys=root

[handlers]
keys=consoleHandler,infoFileHandler,errorFileHandler

[formatters]
keys=prodFormatter

[logger_root]
level=INFO
handlers=consoleHandler,infoFileHandler,errorFileHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=prodFormatter
args=(sys.stdout,)

[handler_infoFileHandler]
class=logging.handlers.TimedRotatingFileHandler
level=INFO
formatter=prodFormatter
args=(
    '%(log_dir)s/info.log',
    'D',
    1,
    90,
    'utf-8',
    False,
    False,
)

[handler_errorFileHandler]
class=logging.handlers.TimedRotatingFileHandler
level=ERROR
formatter=prodFormatter
args=(
    '%(log_dir)s/error.log',
    'D',
    1,
    90,
    'utf-8',
    False,
    False,
)

[formatter_prodFormatter]
format=%(asctime)s %(levelname)s %(name)s %(module)s %(lineno)d %(process)d %(thread)d %(message)s
datefmt=%Y-%m-%dT%H:%M:%S.%fZ